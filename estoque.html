<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FINI Petrópolis · Gestão V31</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--paper:#fff5f9;--card:#fffafc;--ink:#2a1018;--ink-soft:#6b4d55;--ink-faint:#b08090;--line:#f0d0dc;--line-soft:#f7e5ec;--fini:#e8266e;--fini-deep:#c01858;--yellow:#f5c000;--green:#3f8f5f;--blue:#3a6ea5;--shadow:0 18px 44px -22px rgba(60,20,40,.35)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;color:var(--ink);background:radial-gradient(1000px 500px at 95% -5%,rgba(232,38,110,.13),transparent 60%),radial-gradient(700px 600px at -5% 110%,rgba(245,192,0,.1),transparent 55%),var(--paper);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:#1a0810;color:#ffeef5;padding:26px 18px;display:flex;flex-direction:column;gap:5px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{font-family:'Fraunces',serif;font-weight:800;font-size:20px;line-height:1.1;margin-bottom:2px}
.logo em{color:var(--yellow);font-style:normal}
.subtt{font-size:10.5px;color:#c8a0b0;letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px}
.navb{background:none;border:none;color:#d0a0b8;text-align:left;font-family:'DM Sans';font-size:13.5px;font-weight:500;padding:10px 13px;border-radius:11px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.15s;width:100%}
.navb:hover{background:#2f1020;color:#fff}.navb.on{background:var(--fini);color:#fff}
.navb .ic{font-size:15px;width:20px;text-align:center}
.side .sp{flex:1}.side .fb{font-size:10px;color:#7d4f60;line-height:1.6;margin-top:8px}
.main{padding:30px 32px 80px;max-width:1200px;min-width:0}
.htop{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:'Fraunces',serif;font-weight:800;font-size:clamp(24px,3.5vw,36px);line-height:.98}
.hsub{color:var(--ink-soft);font-size:13px;margin-top:3px}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:30px;padding:6px 13px}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);transition:.3s}
.sdot.ok{background:var(--green);box-shadow:0 0 8px rgba(63,143,95,.6)}.sdot.load{background:var(--yellow);animation:pulse 1s infinite}.sdot.offline{background:#e8a23a;box-shadow:0 0 8px rgba(232,162,58,.45)}.sdot.err{background:var(--fini)}
@keyframes pulse{50%{opacity:.35}}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);margin-bottom:16px}
.tl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.inp{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-family:'DM Sans';font-size:13.5px;background:#fff;outline:none;transition:.15s}
.inp:focus{border-color:var(--fini);box-shadow:0 0 0 3px rgba(232,38,110,.12)}
input[type=date].inp{color-scheme:light}
.num{font-family:'DM Mono',monospace;text-align:right}
.arrow{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer;transition:.15s}
.arrow:hover{background:var(--fini);color:#fff;border-color:var(--fini)}
.mesatual{font-family:'Fraunces',serif;font-weight:600;font-size:19px;min-width:165px;text-align:center;text-transform:capitalize}
.btn{border:none;border-radius:11px;padding:10px 16px;font-family:'DM Sans';font-weight:600;font-size:13.5px;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--fini);color:#fff}.btn.primary:hover{background:var(--fini-deep);transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(232,38,110,.6)}
.btn.primary:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink-soft);border:1px solid var(--line)}.btn.ghost:hover{border-color:var(--ink-faint);color:var(--ink)}
.btn.danger{color:var(--fini-deep);border-color:#f3b7c9;background:#fff5f8}.btn.danger:hover{background:#ffe8f1;border-color:var(--fini);color:var(--fini)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.search{flex:1;min-width:150px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.cat{padding:12px 18px;background:#ffeef5;border-top:1px solid var(--line);font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
.cat:first-child{border-top:none}.cat .ct{font-family:'DM Mono';font-size:12px;color:var(--fini);font-weight:500}
.irow{display:flex;align-items:center;gap:10px;padding:7px 18px;border-top:1px solid var(--line-soft)}
.irow:hover{background:#fff5f8}.irow .nm{flex:1;font-size:13.5px;cursor:default}
.irow .nm.editable{cursor:text}.irow .nm.editable:hover{color:var(--fini)}
.irow .nm-hint{font-size:10px;color:var(--ink-faint);margin-left:5px;opacity:0}
.irow:hover .nm-hint{opacity:1}
.nm-inp{flex:1;padding:4px 8px;border:1px solid var(--fini);border-radius:8px;font-family:'DM Sans';font-size:13.5px;outline:none;background:#fff}
.irow .un{font-size:10.5px;color:var(--ink-faint);width:26px}
.count-entry{display:inline-flex;flex-direction:column;align-items:stretch;gap:2px;flex:0 0 auto}
.count-entry .inp.correcting{border-color:var(--fini);background:#fff5f8;box-shadow:0 0 0 3px rgba(232,38,110,.12)}
.count-correct{align-self:center;border:0;background:transparent;color:var(--fini-deep);padding:1px 4px;font-family:'DM Sans';font-size:9.5px;font-weight:700;line-height:1.2;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.count-correct:hover{color:var(--fini)}.count-correct:disabled{color:var(--ink-faint);cursor:default;text-decoration:none}
.totbar{display:flex;gap:20px;flex-wrap:wrap;background:linear-gradient(110deg,rgba(232,38,110,.07),rgba(255,250,252,.5));border:1px solid var(--line);border-radius:16px;padding:15px 20px;margin-bottom:16px}
.tt{display:flex;flex-direction:column;gap:3px}
.tt span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.tt b{font-family:'DM Mono';font-size:clamp(16px,2.5vw,22px);font-weight:500}
.tt b.hl{color:var(--fini)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;padding:10px 12px;background:#ffeef5;position:sticky;top:0;z-index:1}
td{padding:6px 12px;border-top:1px solid var(--line-soft);vertical-align:middle}
td input,td select{width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;font-family:'DM Sans';font-size:13.5px}
td input:focus,td select:focus{border-color:var(--fini);background:#fff;outline:none}
td input.num{font-family:'DM Mono';text-align:right}
tr.wd-dom td:first-child,tr.wd-sab td:first-child{color:var(--fini);font-weight:600}
tr.hojerow{background:#fff5f8}.neg{color:var(--fini)}
.rm{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:14px;padding:3px 7px;border-radius:6px}
.rm:hover{color:var(--fini);background:#fce8f0}
.errmsg{background:#fce8e4;border:1px solid var(--fini);color:var(--fini-deep);border-radius:12px;padding:11px 15px;font-size:13px;margin-bottom:14px}
.foot{margin-top:18px;color:var(--ink-faint);font-size:11px;line-height:1.7}
/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px}
.mbox{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:560px;max-height:85vh;display:flex;flex-direction:column;gap:12px;box-shadow:0 28px 70px rgba(0,0,0,.35)}
.mbox h2{font-family:'Fraunces',serif;font-size:1.2rem;color:var(--fini)}
.mscroll{flex:1;overflow-y:auto;border:1px solid var(--line);border-radius:12px}
.le-row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line-soft)}
.le-row:last-child{border-bottom:none}
.le-nm{flex:1;font-size:13.5px}.le-inp{flex:1;padding:5px 9px;border:1px solid var(--line);border-radius:8px;font-family:'DM Sans';font-size:13.5px;outline:none}
.le-inp:focus{border-color:var(--fini)}.le-sm{padding:5px 9px;border:1px solid var(--line);border-radius:8px;font-family:'DM Sans';font-size:12px;outline:none;background:#fff;width:74px}
.le-sm:focus{border-color:var(--fini)}
.add-row{display:flex;gap:8px;flex-wrap:wrap}
.add-row input,.add-row select{flex:1;min-width:100px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;font-family:'DM Sans';font-size:13.5px;outline:none;background:#fff}
.add-row input:focus,.add-row select:focus{border-color:var(--fini)}
.ma{display:flex;justify-content:flex-end;gap:10px}
.cchips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.cc{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.1s;flex-shrink:0}
.cc.sel{border-color:rgba(0,0,0,.5);transform:scale(1.25)}
/* ESCALA CALENDAR */
.egrid{display:grid;grid-template-columns:repeat(7,minmax(126px,1fr));gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.ewd{text-align:center;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;padding:5px 0}
.ewd.dom,.ewd.sab{color:var(--fini)}
.ecell{background:var(--card);border:1px solid var(--line);border-radius:13px;display:flex;flex-direction:column;overflow:hidden}
.ecell.out{background:transparent;border-color:transparent;opacity:.4}
.ecell.today{border-color:var(--fini);box-shadow:0 0 0 2px rgba(232,38,110,.18)}
.ecell .dnum{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 4px;font-family:'DM Mono';font-size:12.5px;color:var(--ink-soft);flex-shrink:0}
.ecell.today .dnum{color:var(--fini);font-weight:700}
.ecell .badge{font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;background:var(--yellow);color:#3a2a08;border-radius:20px;padding:2px 6px;font-weight:700;cursor:pointer;flex-shrink:0}
.ecell .badge.off{background:var(--line-soft);color:var(--ink-faint)}
/* ESCALA ENTRY ROWS */
.ce-rows{display:flex;flex-direction:column;padding:2px 0 6px;gap:3px}
.ce-row{display:flex;align-items:center;gap:4px;min-height:24px;margin:0 6px;border-radius:9px;transition:.15s}
.ce-row.folga-row{background:#fff0f6;border:1px dashed rgba(232,38,110,.35);padding:4px 5px;order:-1}
.ce-row.folga-row.folga-on{background:linear-gradient(90deg,rgba(232,38,110,.17),#fff7fb);border-style:solid;border-color:rgba(232,38,110,.55);box-shadow:inset 0 0 0 1px rgba(232,38,110,.06)}
.ce-row.slot-row{background:#fff;border:1px solid var(--line-soft);border-left:4px solid #d8c1ca;padding:3px 5px}
.ce-row.slot-row.alert{background:#fff8e3;border-color:#f1ce72}
.ce-tag{font-size:8px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;border-radius:20px;padding:3px 5px;line-height:1;white-space:nowrap;flex-shrink:0}
.ce-tag.folga{background:var(--fini);color:#fff}
.ce-tag.hora{background:var(--line-soft);color:var(--ink-soft)}
.ce-hora{font-family:'DM Mono';font-size:10.5px;color:var(--fini);cursor:pointer;min-width:40px;padding:2px 4px;border-radius:5px;line-height:1.4;text-align:center;flex-shrink:0}
.ce-hora:hover{background:var(--line-soft)}
.ce-hora-inp{font-family:'DM Mono';font-size:10.5px;width:46px;border:1px solid var(--fini);border-radius:6px;padding:2px 4px;outline:none;color:var(--fini);flex-shrink:0;text-align:center;background:#fff}
.ce-select{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:7px;padding:4px 5px;font-family:'DM Sans';font-size:10.5px;color:var(--ink);outline:none}
.ce-select:focus{border-color:var(--fini);background:#fff}
.ce-row.folga-row .ce-select{font-weight:800;color:var(--fini-deep)}
.ce-empty{color:var(--ink-faint);font-style:italic}
.ce-alert{font-size:10px;color:#b77700;cursor:help;flex-shrink:0}
.es-help{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--ink-soft);line-height:1.55}
.ebadges{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ecell.warn{border-color:#e2b84d;box-shadow:0 0 0 2px rgba(245,192,0,.18)}
.ecell .badge.warn{background:#fff0c2;color:#825800}
.es-mini{font-size:9px;color:var(--ink-faint);line-height:1.2;padding:0 8px 5px}
.es-mini b{color:var(--fini)}
/* COMPARATIVO */
.d-pos{color:var(--green);font-weight:700}.d-neg{color:var(--blue);font-weight:700}.d-z{color:var(--ink-faint)}

/* FOLHA DE PONTO */
.ponto-help{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin-bottom:14px;font-size:12.5px;line-height:1.55;color:var(--ink-soft)}
.ponto-help b{color:var(--ink)}
.ponto-scroll{overflow:auto;max-height:66vh}
.ponto-table{min-width:1180px;font-size:12.5px}
.ponto-table th{white-space:nowrap;top:0}
.ponto-table td{padding:5px 8px;white-space:nowrap}
.ponto-table td input,.ponto-table td select{font-size:12.5px;padding:5px 7px;min-width:0}.ponto-table td select{min-width:138px}.ponto-table .ptype{width:155px;min-width:155px}
.ponto-table .pdate{font-family:'DM Mono';font-weight:600;color:var(--ink-soft);width:86px}
.ponto-table .pdom{color:var(--fini);font-weight:700}
.ponto-table .pfer{background:#fff9dc}
.ponto-table .pfolga{background:#eef9f2}
.ponto-table .palert{background:#fff5e7}
.pmini{font-size:10.5px;color:var(--ink-faint);line-height:1.35;margin-top:3px}
.psaldo-pos{color:var(--blue)!important}.psaldo-neg{color:#d72638!important}.psaldo-zero{color:var(--ink-faint)!important}
.pchip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 8px;border:1px solid var(--line);background:#fff;font-size:11px;color:var(--ink-soft);font-weight:700}
.pchip.on{background:#fff1f6;color:var(--fini);border-color:#f3b7c9}
.func-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.func-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-family:'DM Sans';font-size:13px;font-weight:800;color:var(--ink-soft);cursor:pointer;transition:.15s}
.func-chip:hover{border-color:var(--fini);color:var(--fini)}
.func-chip.on{background:var(--fini);border-color:var(--fini);color:#fff;box-shadow:0 8px 18px -12px rgba(232,38,110,.8)}
.troco-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;padding:14px}
.troco-cell{border:1px solid var(--line-soft);background:#fff;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:5px}
.troco-cell .den{font-family:'DM Mono';font-weight:800;font-size:13px;color:var(--ink)}
.troco-cell .ttl{font-family:'DM Mono';font-size:12px;color:var(--fini);text-align:right}
.troco-cell input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:'DM Mono';font-size:13px;text-align:right;outline:none}
.troco-cell input:focus{border-color:var(--fini);box-shadow:0 0 0 3px rgba(232,38,110,.10)}
.caixa-obs{width:120px!important;min-width:120px!important}
.pinput-mini{width:78px!important;font-family:'DM Mono'!important;text-align:center!important}
.pinput-mini[readonly]{background:#fffafc!important;color:var(--ink-soft)!important;cursor:not-allowed!important}
.pobs{min-width:170px!important}
@media(max-width:820px){.ponto-scroll{max-height:none}.ponto-table{min-width:1080px}}

/* V25 - interface gerencial limpa */
body{font-size:14px}
.main{width:100%;max-width:1440px;padding:24px 28px 64px}
.htop{margin-bottom:14px;align-items:center}.htop h1{font-size:clamp(23px,2.8vw,32px);line-height:1.08}.hsub{font-size:12.5px;line-height:1.45}
.toolbar{padding:10px 12px;border-radius:14px;margin-bottom:12px;box-shadow:0 10px 28px -24px rgba(60,20,40,.42)}
.totbar{padding:11px 14px;gap:24px;border-radius:13px;margin-bottom:12px}.tt b{font-size:clamp(15px,2vw,19px)}
.panel{border-radius:13px;box-shadow:0 10px 30px -26px rgba(60,20,40,.45);overflow:auto}
table{font-size:12.5px}th{padding:8px 10px}td{padding:5px 10px}
.clean-note{font-size:11.5px;color:var(--ink-soft);line-height:1.45}.status.compact{background:transparent;border:0;padding:3px 0}.foot{display:none!important}
.save-note{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:11px;min-height:18px}
.save-note.ok{color:var(--green)}.save-note.err{color:var(--fini)}
.table-wrap{overflow:auto;-webkit-overflow-scrolling:touch}
.sticky-first th:first-child,.sticky-first td:first-child{position:sticky;left:0;z-index:2;background:var(--card)}.sticky-first th:first-child{z-index:3;background:#ffeef5}
.schedule-table{min-width:760px}.schedule-table th,.schedule-table td{text-align:center}.schedule-table th:first-child,.schedule-table td:first-child{text-align:left;min-width:145px}
.schedule-table .holiday-row td{background:#fff9dc}.schedule-table .sunday-row td:first-child{color:var(--fini);font-weight:700}
.schedule-select{min-width:132px!important;text-align:center;font-weight:700}.schedule-select.work{color:var(--green)}.schedule-select.off{color:var(--fini)}
.holiday-name{display:block;font-size:9.5px;color:#9a6b00;margin-top:2px;white-space:normal;line-height:1.2}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px;margin:12px 0}.summary-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.summary-card strong{font-size:13px}.summary-card dl{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin-top:7px;font-size:11px}.summary-card dt{color:var(--ink-soft)}.summary-card dd{font-family:'DM Mono';font-weight:700}
.print-area{display:none}.print-title{font-family:Arial,sans-serif;font-size:15pt;font-weight:700;margin-bottom:2mm}.print-subtitle{font-family:Arial,sans-serif;font-size:9pt;margin-bottom:4mm;color:#333}.signature-box{display:grid;grid-template-columns:1fr 1fr;gap:14mm;margin-top:10mm}.signature-line{border-top:1px solid #222;text-align:center;padding-top:2mm;font:9pt Arial}
.point-table-v25{min-width:960px}.point-table-v25 th,.point-table-v25 td{white-space:nowrap}.point-table-v25 .pobs{min-width:150px!important}.time-input{width:70px!important;font-family:'DM Mono'!important;text-align:center!important}
